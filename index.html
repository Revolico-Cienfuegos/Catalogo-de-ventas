  return nombre
    .replace(/[\u{1F300}-\u{1FAFF}]/gu, '')
    .replace(/[\u2600-\u27BF]/gu, '')

function aplicarProteccionImagenes() {
  document.querySelectorAll('img').forEach(img => {
    img.setAttribute('draggable', 'false');
    img.addEventListener('contextmenu', e => e.preventDefault());
  });
}

(function protegerContenido() {
  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    alert('🛡️ El contenido de esta web está protegido.');
  });

  document.addEventListener('keydown', function(e) {
    if (e.ctrlKey && ['c', 'u', 's', 'p'].includes(e.key.toLowerCase())) {
      e.preventDefault();
      alert('🛡️ Esta acción no está permitida.');
      return false;
    }
    if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J')) {
      e.preventDefault();
      alert('🛡️ Esta acción no está permitida.');
      return false;
    }
    if (e.key === 'F12') {
      e.preventDefault();
      window.location.reload();
      return false;
    }
  });

  document.addEventListener('dragstart', function(e) {
    if (e.target.tagName === 'IMG') {
      e.preventDefault();
      return false;
    }
  });

  document.addEventListener('copy', function(e) {
    const seleccion = window.getSelection().toString();
    if (seleccion.length > 10) {
      const mensaje = seleccion + '\n\n📌 Fuente: VENTACIEN - https://revolico-cienfuegos.github.io/Catalogo-de-ventas/';
      e.clipboardData.setData('text/plain', mensaje);
      e.preventDefault();
    }
  });

  aplicarProteccionImagenes();
})();

//  UTILIDADES

function isMobile(){ return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent); }

function fmt(p){
  const val = parseFloat(p) || 0;
  const factor = TASAS[monedaActual] || 1;
  const total = (val * factor).toFixed(2);
  return `${total} ${monedaActual}`;
}

function fmtRaw(p){
  const val = parseFloat(p) || 0;
  const factor = TASAS[monedaActual] || 1;
  return val * factor;
}

function nombreCat(id){ return CATEGORIAS.find(c=>c.id===id)?.nombre||id; }
function icoCat(id){ return CATEGORIAS.find(c=>c.id===id)?.ico||"📦"; }

function openWA(msg){
  const enc = encodeURIComponent(msg);
  const url = isMobile() ? `whatsapp://send?phone=${WA}&text=${enc}` : `https://web.whatsapp.com/send?phone=${WA}&text=${enc}`;
  if(isMobile()){
    const fb = `https://api.whatsapp.com/send?phone=${WA}&text=${enc}`;
    const t = setTimeout(()=>{ window.location.href=fb; },1500);
    window.addEventListener("blur",()=>clearTimeout(t),{once:true});
    window.location.href=url;
  } else {
    window.open(url,"_blank");
  }
}

function toast(msg, type="success"){
  const c = document.getElementById("toastContainer");
  const t = document.createElement("div");
  t.className = `toast ${type}`;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(()=>{ if(t.parentNode) t.remove(); }, 3000);
}

function trackEvent(category, action, label, value){
  if (typeof gtag === 'function') {
    gtag('event', action, {
      'event_category': category,
      'event_label': label || undefined,
      'value': value || undefined
    });
  }
}

// ============================================================
//  CARRITO
// ============================================================
function cargarCarrito(){
  try {
    const d = localStorage.getItem("vc_carrito");
    carrito = d ? JSON.parse(d) : [];
  } catch(e){ carrito=[]; }
  actualizarBadge();
}
function guardarCarrito(){
  localStorage.setItem("vc_carrito", JSON.stringify(carrito));
  actualizarBadge();
}
function actualizarBadge(){
  const total = carrito.reduce((s,i)=>s+i.cantidad,0);
  document.getElementById("cartBadge").textContent = total;
  renderCarrito();
}

function agregarAlCarrito(producto){
  const existente = carrito.find(i => i.id === producto.id);
  if(existente){
    existente.cantidad += 1;
  } else {
    carrito.push({ ...producto, cantidad: 1 });
  }
  guardarCarrito();
  toast(`✅ ${producto.nombre} agregado al carrito`);
  trackEvent('Carrito', 'add_to_cart', producto.nombre, parseFloat(producto.precio));
}

function eliminarDelCarrito(id){
  carrito = carrito.filter(i => i.id !== id);
  guardarCarrito();
  renderCarrito();
}

function cambiarCantidad(id, delta){
  const item = carrito.find(i => i.id === id);
  if(!item) return;
  const nuevaCant = item.cantidad + delta;
  if (nuevaCant <= 0) {
    eliminarDelCarrito(id);
    return;
  }
  item.cantidad = nuevaCant;
  guardarCarrito();
  renderCarrito();
}

function vaciarCarrito(){
  if(carrito.length === 0) return;
  if(!confirm("¿Vaciar el carrito?")) return;
  carrito = [];
  guardarCarrito();
  renderCarrito();
  toast("Carrito vaciado");
}

function totalCarrito(){
  return carrito.reduce((s,i) => s + fmtRaw(i.precio) * i.cantidad, 0);
}

function renderCarrito(){
  const body = document.getElementById("cartBody");
  const footer = document.getElementById("cartFooter");
  const totalEl = document.getElementById("cartTotal");

  if(carrito.length === 0){
    body.innerHTML = `<div class="cart-empty"><div class="ico">🛒</div><p>Tu carrito está vacío</p></div>`;
    footer.style.display = "none";
    return;
  }
  footer.style.display = "block";
  const total = totalCarrito();
  totalEl.textContent = `${total.toFixed(2)} ${monedaActual}`;

  body.innerHTML = carrito.map(item => `
    <div class="cart-item">
      ${item.imagen ? `<img class="cart-item-img" src="${item.imagen}" alt="${item.nombre}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'cart-item-img\\' style=\\'display:flex;align-items:center;justify-content:center;font-size:20px;\\'>🖼️</div>'">` : `<div class="cart-item-img" style="display:flex;align-items:center;justify-content:center;font-size:20px;">🖼️</div>`}
      <div class="cart-item-info">
        <div class="cart-item-nombre">${item.nombre}</div>
        <div class="cart-item-precio">${fmt(item.precio)}</div>
      </div>
      <div class="cart-item-actions">
        <button onclick="cambiarCantidad('${item.id}', -1)">−</button>
        <span class="qty">${item.cantidad}</span>
        <button onclick="cambiarCantidad('${item.id}', 1)">+</button>
        <button class="remove" onclick="eliminarDelCarrito('${item.id}')">✕</button>
      </div>
    </div>
  `).join("");

  aplicarProteccionImagenes();
}

function abrirPlanilla(producto){
  productoParaPedir = producto;
  document.getElementById("orderFormOverlay").classList.add("open");
  document.getElementById("ofNombre").value = "";
  document.getElementById("ofTelefono").value = "";
  document.getElementById("ofDireccion").value = "";
  document.getElementById("ofReferencia").value = "";
  document.getElementById("ofObservaciones").value = "";
  document.querySelectorAll(".order-form .error").forEach(e=>e.style.display="none");

  if (producto) {
    trackEvent('Checkout', 'begin_checkout', producto.nombre, parseFloat(producto.precio));
  }
}

document.getElementById("cartCheckout").addEventListener("click", ()=>{
  if(carrito.length === 0){ toast("El carrito está vacío", "error"); return; }
  productoParaPedir = null;
  document.getElementById("orderFormOverlay").classList.add("open");
  document.getElementById("ofNombre").value = "";
  document.getElementById("ofTelefono").value = "";
  document.getElementById("ofDireccion").value = "";
  document.getElementById("ofReferencia").value = "";
  document.getElementById("ofObservaciones").value = "";
  document.querySelectorAll(".order-form .error").forEach(e=>e.style.display="none");

  trackEvent('Checkout', 'begin_checkout', 'Desde carrito', totalCarrito());
});

document.getElementById("ofCancel").addEventListener("click", ()=>{
  document.getElementById("orderFormOverlay").classList.remove("open");
  productoParaPedir = null;
});

document.getElementById("ofSend").addEventListener("click", ()=>{
  let ok = true;
  const nombre = document.getElementById("ofNombre").value.trim();
  const telefono = document.getElementById("ofTelefono").value.trim();
  const direccion = document.getElementById("ofDireccion").value.trim();
  const referencia = document.getElementById("ofReferencia").value.trim();
  const obs = document.getElementById("ofObservaciones").value.trim();

  document.querySelectorAll(".order-form .error").forEach(e=>e.style.display="none");

  if(!nombre){ document.getElementById("ofNombreErr").style.display="block"; ok=false; }
  if(!telefono){ document.getElementById("ofTelefonoErr").style.display="block"; ok=false; }
  if(!direccion){ document.getElementById("ofDireccionErr").style.display="block"; ok=false; }
  if(!referencia){ document.getElementById("ofReferenciaErr").style.display="block"; ok=false; }
  if(!ok) return;

  const fecha = new Date().toLocaleDateString("es-CU", { day:"2-digit", month:"2-digit", year:"numeric" });
  const moneda = monedaActual;

  let items, total;
  if(productoParaPedir){
    items = `* ${productoParaPedir.nombre} x1`;
    total = fmtRaw(productoParaPedir.precio);
  } else {
    items = carrito.map(i => `* ${i.nombre} x${i.cantidad}`).join("\n");
    total = totalCarrito();
  }

  const msg = `❗❗ PLANILLA DE VENTA ❗❗
📅 Fecha: ${fecha}
👤 Nombre del cliente: ${nombre}
📱 Teléfono del cliente: ${telefono}
📦 Equipo(s) a comprar:
${items}
💵 Cantidad y tipo de moneda: ${total.toFixed(2)} ${moneda}
💵 Cambio: 
🗺️ Dirección: ${direccion}
🗺️ Punto de referencia: ${referencia}
📝 Observaciones: ${obs || "(Ninguna)"}
Muchas gracias.`;

  trackEvent('Checkout', 'purchase', 'Pedido completado', total);

  document.getElementById("orderFormOverlay").classList.remove("open");
  productoParaPedir = null;
  openWA(msg);
});

// ============================================================
//  RENDERIZADO PRINCIPAL
// ============================================================
function renderizarContenido(){
  const contenido = document.getElementById("contenido");
  const contenidoGarantia = document.getElementById("contenidoGarantia");
  const vacio = document.getElementById("vacio");
  const resultadosBusqueda = document.getElementById("resultadosBusqueda");
  const skeletons = document.getElementById("skeletons");

  skeletons.style.display = "none";
  contenido.style.display = "none";
  contenidoGarantia.style.display = "none";
  vacio.style.display = "none";
  resultadosBusqueda.style.display = "none";

  if (catActiva === "garantia-domicilio") {
    contenidoGarantia.style.display = "block";
    contenidoGarantia.innerHTML = renderGarantiaDomicilio();
    aplicarProteccionImagenes();
    return;
  }

  if (!DATA.length) {
    vacio.style.display = "block";
    return;
  }

  const datos = catActiva === "todas" ? DATA : DATA.filter(p => p.categoria === catActiva);
  if (!datos.length) {
    vacio.style.display = "block";
    vacio.innerHTML = `<div class="ico">${icoCat(catActiva)}</div><div>Todavía no hay productos en "${nombreCat(catActiva)}".</div>`;
    return;
  }

  const porCat = {};
  datos.forEach((p, i) => {
    const cat = p.categoria || "miscelaneos";
    if (!porCat[cat]) porCat[cat] = [];
    porCat[cat].push({ p, idx: DATA.indexOf(p) });
  });

  for (const catId in porCat) {
    porCat[catId].sort((a, b) => {
      const nombreA = limpiarNombreParaOrdenar(a.p.nombre);
      const nombreB = limpiarNombreParaOrdenar(b.p.nombre);
      return nombreA.localeCompare(nombreB, 'es', { sensitivity: 'base' });
    });
  }

  let htmlFinal = '';

  // Sección de más vendidos (solo para "Todos")
  if (catActiva === "todas") {
    const masVendidos = datos.filter(p => p.esMasVendido === true);
    if (masVendidos.length) {
      htmlFinal += `<section class="seccion" id="seccion-mas-vendidos">
        <div class="seccion-header">
          <span class="seccion-ico">🔥</span>
          <span class="seccion-titulo">Lo más vendido</span>
          <span class="seccion-count">${masVendidos.length} productos</span>
        </div>
        <div class="grid">${masVendidos.map((p) => cardHTML(p, DATA.indexOf(p), true)).join("")}</div>
      </section>`;
    }
  }

  const orden = CATEGORIAS.filter(c => c.id !== "garantia-domicilio" && c.id !== "todas").map(c => c.id).filter(id => porCat[id]);

  htmlFinal += orden.map(catId => {
    const cat = CATEGORIAS.find(c => c.id === catId);
    const items = porCat[catId];
    return `<section class="seccion" id="cat-${catId}">
      <div class="seccion-header">
        <span class="seccion-ico">${cat.ico}</span>
        <span class="seccion-titulo">${cat.nombre}</span>
        <span class="seccion-count">${items.length} producto${items.length!==1?"s":""}</span>
      </div>
      <div class="grid">${items.map(({p, idx}) => cardHTML(p, idx, false)).join("")}</div>
    </section>`;
  }).join("");

  contenido.innerHTML = htmlFinal;
  bindCards(contenido);
  aplicarProteccionImagenes();
}

function cardHTML(p, idx, mostrarTag=false){
  const tag = mostrarTag ? `<div class="card-cat-tag">${icoCat(p.categoria)} ${nombreCat(p.categoria)}</div>` : "";

  let badges = '';
  if (p.esNuevo) badges += `<span class="badge badge-nuevo">✨ Nuevo</span>`;
  if (p.esMasVendido) badges += `<span class="badge badge-mas-vendido">🔥 Más vendido</span>`;

  const hasImg = p.imagen && p.imagen.length > 0;
  const imgSrc = hasImg ? p.imagen : "";
  const imgWrap = `<div class="card-img-wrap" style="position:relative;">
    ${hasImg ? `<img class="card-img" src="${imgSrc}" alt="${p.nombre}" loading="lazy" decoding="async" data-idx="${idx}" onerror="this.style.display='none'; this.parentElement.querySelector('.card-img-ph').style.display='flex';">` : ''}
    <div class="card-img-ph" style="display:${hasImg ? 'none' : 'flex'};" data-idx="${idx}">${IMG_PH_ICO}<span>Sin foto</span></div>
    <div style="position:absolute; top:8px; left:8px; display:flex; flex-direction:column; gap:4px; z-index:2;">
      ${badges}
    </div>
  </div>`;

  const precio = p.precio ? `<div class="card-precio">${fmt(p.precio)}</div>` : `<div class="card-precio" style="font-size:12px;color:var(--text-muted);">Consultar</div>`;

  return `<article class="card">
    ${imgWrap}${tag}
    <div class="card-body">
      <div class="card-nombre" data-idx="${idx}">${p.nombre}</div>
      ${precio}
      <div class="card-actions">
        <button class="card-pedir" data-idx="${idx}" data-action="pedir">${WA_ICO} Pedir</button>
        <button class="card-add" data-idx="${idx}" data-action="add">+</button>
      </div>
    </div>
  </article>`;
}

function bindCards(container){
  container.querySelectorAll("[data-idx]:not([data-action])").forEach(el=>{
    el.addEventListener("click",()=>abrirModal(DATA[+el.dataset.idx]));
  });
  container.querySelectorAll("[data-action='pedir']").forEach(btn=>{
    btn.addEventListener("click", e=>{
      e.stopPropagation();
      const producto = DATA[+btn.dataset.idx];
      abrirPlanilla(producto);
    });
  });
  container.querySelectorAll("[data-action='add']").forEach(btn=>{
    btn.addEventListener("click", e=>{
      e.stopPropagation();
      const p = DATA[+btn.dataset.idx];
      agregarAlCarrito(p);
    });
  });
}

// ============================================================

function renderBusqueda(q){
  const rb = document.getElementById("resultadosBusqueda");
  const contenido = document.getElementById("contenido");
  const contenidoGarantia = document.getElementById("contenidoGarantia");
  const label = document.getElementById("searchLabel");
  const skeletons = document.getElementById("skeletons");

  skeletons.style.display = "none";
  contenido.style.display = "none";
  contenidoGarantia.style.display = "none";
  document.getElementById("vacio").style.display = "none";

  const ql = q.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const res = DATA.map((p,idx)=>({p,idx})).filter(({p})=>{
    const hay = `${p.nombre} ${p.descripcion||""} ${nombreCat(p.categoria)} ${p.precio||""} ${p.moneda||""}`.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
    return hay.includes(ql);
  });

  res.sort((a, b) => {
    const nombreA = limpiarNombreParaOrdenar(a.p.nombre);
    const nombreB = limpiarNombreParaOrdenar(b.p.nombre);
    return nombreA.localeCompare(nombreB, 'es', { sensitivity: 'base' });
  });

  label.style.display="block";
  label.textContent = res.length ? `${res.length} resultado${res.length!==1?"s":""} para "${q}"` : `Sin resultados para "${q}"`;

  if(!res.length){
    rb.style.display="block";
    rb.innerHTML=`<div class="empty"><div class="ico">🔍</div><div>No encontramos productos con ese nombre o precio.</div></div>`;
    return;
  }
  rb.style.display="block";
  rb.innerHTML=`<div class="grid">${res.map(({p,idx}) => cardHTML(p, idx, true)).join("")}</div>`;
  bindCards(rb);
  aplicarProteccionImagenes();
}

// ============================================================
//  CATEGORÍAS NAV
// ============================================================
function buildCatsNav(){
  const nav = document.getElementById("catsNav");
  const inner = document.getElementById("catsInner");
  nav.style.display="block";

  inner.innerHTML = CATEGORIAS.map(c =>
    `<button class="cat-btn ${catActiva === c.id ? 'active' : ''}" data-cat="${c.id}" style="scroll-snap-align:start;">
      <span class="cat-ico">${c.ico}</span>${c.nombre}
    </button>`
  ).join("");

  inner.querySelectorAll(".cat-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      inner.querySelectorAll(".cat-btn").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      catActiva = btn.dataset.cat;
      localStorage.setItem(CATEGORIA_GUARDADA_KEY, catActiva);
      limpiarBusqueda();
      renderizarContenido();

      const navRect = nav.getBoundingClientRect();
      const btnRect = btn.getBoundingClientRect();
      const scrollLeft = btn.offsetLeft - (navRect.width / 2) + (btnRect.width / 2);
      nav.scrollTo({ left: scrollLeft, behavior: 'smooth' });
    });
  });

  nav.style.scrollSnapType = 'x mandatory';
  nav.style.webkitOverflowScrolling = 'touch';
}

// ============================================================
//  ACTUALIZACIÓN AUTOMÁTICA SIN SERVICE WORKER
//  (comprueba si el HTML ha cambiado cada 30 segundos y recarga)
// ============================================================
(function autoUpdate() {
  // Guardar la versión actual en localStorage
  const VERSION_KEY = 'ventacien_version';
  const currentVersion = document.querySelector('meta[name="theme-color"]')?.content + Date.now().toString(36);
  
  // Si no hay versión guardada, guardar la actual
  if (!localStorage.getItem(VERSION_KEY)) {
    localStorage.setItem(VERSION_KEY, currentVersion);
    return;
  }

  // Comprobar si la página ha cambiado cada 30 segundos
  setInterval(() => {
    // Hacer un fetch al HTML actual con un timestamp para evitar caché
    fetch(window.location.href + '?v=' + Date.now(), {
      method: 'HEAD',
      cache: 'no-store'
    })
    .then(res => {
      // Obtener el Last-Modified o ETag
      const lastModified = res.headers.get('Last-Modified');
      const etag = res.headers.get('ETag');
      // Guardar en localStorage la referencia
      const storedVersion = localStorage.getItem(VERSION_KEY);
      // Si cambia, recargar
      if (lastModified && storedVersion !== lastModified) {
        localStorage.setItem(VERSION_KEY, lastModified);
        window.location.reload(true);
      } else if (etag && storedVersion !== etag) {
        localStorage.setItem(VERSION_KEY, etag);
        window.location.reload(true);
      }
    })
    .catch(() => {});
  }, 30000); // cada 30 segundos
})();

// ============================================================
//  CARGA DE PRODUCTOS
// ============================================================
function cargarProductos(){
  const local = localStorage.getItem("vc_admin_productos");
  if(local) {
    try {
      const datos = JSON.parse(local);
      if(Array.isArray(datos) && datos.length > 0) {
        DATA = datos;
        buildCatsNav();
        renderizarContenido();
        console.log("✅ Productos cargados desde localStorage (fallback)");
        return;
      }
    } catch(e) {}
  }

  const url = "productos.json?_=" + Date.now();
  fetch(url, { 
    cache: "no-store",
    headers: { "Cache-Control": "no-cache" }
  })
    .then(res => {
      if (!res.ok) throw new Error(`HTTP ${res.status} - ${res.statusText}`);
      return res.json();
    })
    .then(data => {
      if (Array.isArray(data) && data.length > 0) {
        DATA = data;
        localStorage.setItem("vc_admin_productos", JSON.stringify(DATA));
        buildCatsNav();
        renderizarContenido();
        console.log("✅ Productos cargados desde el servidor");
      } else {
        throw new Error("El archivo productos.json está vacío o no es válido");
      }
    })
    .catch(err => {
      console.error("❌ Error cargando productos:", err);
      document.getElementById("skeletons").style.display = "none";
      document.getElementById("vacio").style.display = "block";
      document.getElementById("vacio").innerHTML = `
        <div class="ico">⚠️</div>
        <div style="font-weight:600; margin-bottom:6px;">No se pudieron cargar los productos.</div>
        <div style="font-size:13px; color:var(--text-secondary);">Verifica tu conexión o que el archivo <code>productos.json</code> exista en el servidor.</div>
        <div style="font-size:12px; margin-top:8px; color:var(--text-muted);">Error: ${err.message || "Desconocido"}</div>
        <button onclick="location.reload()" style="margin-top:12px; padding:8px 20px; background:#0a1a2b; color:#fff; border:none; border-radius:6px; font-weight:700; cursor:pointer;">Recargar</button>
      `;
    });
}
